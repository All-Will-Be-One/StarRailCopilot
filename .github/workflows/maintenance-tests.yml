name: Maintenance tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Build pinned PyAV against Ubuntu FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev
          python -m pip install 'Cython==0.29.37' 'setuptools==69.5.1' 'wheel==0.45.1'
          python -m pip install --no-build-isolation 'av==10.0.0'
      - run: python -m pip install -r requirements.txt
      - run: bash -n deploy/Linux/hsr-update.sh
      - run: python -m unittest discover -s tests -v
